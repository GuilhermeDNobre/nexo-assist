services:
  postgres:
    image: postgres:17
    container_name: nexo-assist-postgres
    environment:
      POSTGRES_USER: nexo
      POSTGRES_PASSWORD: nexo
      POSTGRES_DB: nexo
    ports:
      - "5432:5432"
    volumes:
      - nexo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexo -d nexo"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-init:
    image: postgres:17
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: nexo
    entrypoint:
      - sh
      - -c
      - |
        psql -h postgres -U nexo -d nexo -tc "SELECT 1 FROM pg_database WHERE datname = 'nexo_test'" | grep -q 1 || psql -h postgres -U nexo -d nexo -c "CREATE DATABASE nexo_test"

volumes:
  nexo_postgres_data:
